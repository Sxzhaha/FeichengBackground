    alert-prefix: ${IOT_CONTROL_RES_ALERT_PREFIX:A}
    manual-prefix: ${IOT_CONTROL_RES_MANUAL_PREFIX:M}
xwq:
  ai:
    phenology:
      mock-enabled: true
