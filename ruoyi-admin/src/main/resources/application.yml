# 和风天气配置
qweather:
  apiHost: pc3fbxx8vu.re.qweatherapi.com
  apiKey: a2eb8973f58e46558b1e8b553c4d8689
  # 实时天气默认每2小时同步一次，未来七天天气默认每6小时同步一次
  live-cron: '${QWEATHER_LIVE_CRON:0 0 0/2 * * ?}'
  forecast-cron: '${QWEATHER_FORECAST_CRON:0 5 0/6 * * ?}'
  time-zone: Asia/Shanghai
  sync-on-startup: true
  # 防止服务器网络异常时请求长期占用定时调度线程
  connect-timeout-ms: 10000
  read-timeout-ms: 30000
# 物联网配置
